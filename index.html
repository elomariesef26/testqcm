<!DOCTYPE html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Test étudiant</title>
<style>
:root{--qa:#bfdbfe;--qb:#fed7aa}
body{font-family:system-ui,sans-serif;background:#f3f4f8;margin:0;padding:16px;color:#222;transition:background .3s}
body.qa{background:var(--qa)}body.qb{background:var(--qb)}
#app{max-width:560px;margin:auto;background:#fff;padding:24px;border-radius:12px;box-shadow:0 2px 10px #0002}
input,button{font-size:16px;padding:10px;margin:4px 0;width:100%;box-sizing:border-box;border:1px solid #bbb;border-radius:8px}
button{background:#2557d6;color:#fff;border:0;cursor:pointer;margin-top:14px}
button.s{background:#6b7280;font-size:14px;padding:6px}
.w{background:#fff3cd;border:1px solid #e0a800;padding:10px;border-radius:8px;margin:12px 0}
.e{background:#fde2e2;border-color:#d33}
.g{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.g label input{display:none}.g label span{display:block;text-align:center;padding:14px;border:2px solid #bbb;border-radius:8px;cursor:pointer;font-weight:bold}
.g input:checked+span{background:#2557d6;color:#fff;border-color:#2557d6}
.t{font-size:20px;text-align:right}
table{width:100%;border-collapse:collapse;margin:10px 0}td,th{border:1px solid #ddd;padding:6px;text-align:center}th{background:#e8ecf8}
.info td:first-child{background:#e8ecf8;font-weight:bold;text-align:left;width:45%}
@media print{body{background:#fff!important;padding:0}#app{box-shadow:none;max-width:none;padding:0}.np{display:none}}
</style></head><body><div id="app"></div>
<script>
let PR=JSON.parse(localStorage.getItem('qcm_profil')||'null'),cfg,i,ans,timer,left,run=false;
const app=document.getElementById('app'),$=s=>document.querySelector(s),bg=k=>document.body.className=k||'';
const WARN='<div class="w">⚠ <b>Ne quittez pas la page et ne changez pas de fenêtre jusqu\'à la fin du test.</b> Sinon, l\'historique de vos réponses sera perdu.</div>';
/* Étape 1 : profil (une seule fois, sauvegardé localement) */
function profil(){
 run=false;clearInterval(timer);bg();const p=PR||{};
 app.innerHTML=`<h2>Mes informations</h2><p>À saisir une seule fois : elles sont enregistrées sur cet appareil.</p>
 <input id=cls placeholder="Classe" value="${p.classe||''}"><input id=id placeholder="Identifiant" value="${p.id||''}"><input id=nom placeholder="Nom et prénom" value="${p.nom||''}">
 <button onclick="saveP()">Enregistrer</button>`}
function saveP(){
 const p={classe:$('#cls').value.trim(),id:$('#id').value.trim(),nom:$('#nom').value.trim()};
 if(!p.classe||!p.id||!p.nom)return alert('Veuillez remplir tous les champs.');
 PR=p;localStorage.setItem('qcm_profil',JSON.stringify(p));testScreen()}
/* Étape 2 : informations du test */
function testScreen(msg){
 run=false;clearInterval(timer);bg();const c=cfg||{};
 app.innerHTML=`<h2>Configuration du test</h2>${msg?'<div class="w e">'+msg+'</div>':''}
 <p><b>${PR.nom}</b> · ${PR.id} · Classe ${PR.classe}</p><button class="s" onclick="profil()">Modifier mes informations</button>${WARN}
 <input id=test placeholder="Nom du test" value="${c.test||''}"><input id=n type=number min=1 placeholder="Nombre de questions" value="${c.n||''}">
 <input id=dur type=number min=5 placeholder="Durée par question (secondes)" value="${c.dur||''}"><label style="display:flex;align-items:center;gap:10px;margin:10px 0;cursor:pointer"><input id=nx type=checkbox style="width:auto;margin:0" ${c.next===false?'':'checked'}> Afficher le bouton « Suivant » avec les questions</label><button onclick="valider()">Valider</button>`}
function valider(){
 const c={test:$('#test').value.trim(),n:+$('#n').value,dur:+$('#dur').value,next:$('#nx').checked};
 if(!c.test||c.n<1||c.dur<5)return alert('Veuillez remplir tous les champs (durée ≥ 5 s).');
 cfg=c;
 app.innerHTML=`<h2>${c.test}</h2><p>${PR.nom} (${PR.id}) · Classe ${PR.classe}<br>${c.n} questions · ${c.dur} s par question</p>${WARN}<button onclick="start()">Commencer le test</button>`}
/* Déroulement */
function start(){i=0;ans=[];run=true;q();
 timer=setInterval(()=>{if(--left<=0)next();else $('#t').textContent=left},1000)}
let cur={c:null,d:null};
function pick(k,v){cur[k]=v;$('#b'+k).style.display='none'}
function q(){left=cfg.dur;cur={c:null,d:null};bg(i%2?'qb':'qa');
 const g=(nm,vals)=>`<div class="g">${vals.map(v=>`<label><input type=radio name=${nm} value=${v} onchange="pick('${nm}',this.value)"><span>${v}</span></label>`).join('')}</div>`;
 app.innerHTML=`<div class="t">⏱ <span id=t>${left}</span> s</div><h2>Question N° ${i+1} / ${cfg.n}</h2>
 <div id=bc><h3>Choix</h3>${g('c',['A','B','C','D'])}</div><div id=bd><h3>Degré de certitude</h3>${g('d',[1,2,3,4])}</div>
 ${cfg.next===false?'':`<button onclick="next()">${i+1==cfg.n?'Terminer':'Suivant'}</button>`}`}
function next(){
 ans.push({q:i+1,choix:cur.c,certitude:cur.d?+cur.d:null});
 if(++i>=cfg.n)return fin();q()}
/* Récapitulatif final */
function fin(){
 clearInterval(timer);run=false;bg();
 const date=new Date().toLocaleString('fr-FR');
 window._d={test:cfg.test,classe:PR.classe,id:PR.id,nom:PR.nom,date:new Date().toISOString(),dureeQuestion:cfg.dur,reponses:ans};
 document.title=`Recapitulatif_${cfg.test}_${PR.id}`;
 const row=(a,b)=>`<tr><td>${a}<td style="text-align:left">${b}</tr>`;
 app.innerHTML=`<div class="np"><h2>Test terminé ✔</h2><button onclick="dl()">Téléchargez mes réponses (JSON)</button></div>
 <h2>Récapitulatif — ${cfg.test}</h2>
 <table class="info">${row('Classe',PR.classe)}${row('Identifiant',PR.id)}${row('Nom et prénom',PR.nom)}${row('Nom du test',cfg.test)}${row('Nombre de questions',cfg.n)}${row('Durée par question',cfg.dur+' s')}${row('Date',date)}</table>
 <table><tr><th>Question<th>Choix<th>Certitude</tr>${ans.map(a=>`<tr><td>${a.q}<td>${a.choix||'—'}<td>${a.certitude||'—'}</tr>`).join('')}</table>
 <button class="np" onclick="window.print()">Télécharger en PDF</button>
 <p class="np" style="font-size:13px;color:#555">Dans la fenêtre d'impression, choisissez « Enregistrer au format PDF » comme imprimante.</p>`}
/* Chiffrement AES-GCM ; mot de passe = classe&identifiant&nom du test */
const b64=u=>btoa(String.fromCharCode(...new Uint8Array(u)));
async function encrypt(obj){
 if(!crypto.subtle)throw new Error('nocrypto');
 const pw=[obj.classe,obj.id,obj.test].map(x=>String(x).trim().toLowerCase()).join('&'),enc=new TextEncoder();
 const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12));
 const km=await crypto.subtle.importKey('raw',enc.encode(pw),'PBKDF2',false,['deriveKey']);
 const key=await crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:100000,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt']);
 const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,enc.encode(JSON.stringify(obj)));
 return {qcm:1,enc:true,id:obj.id,salt:b64(salt),iv:b64(iv),data:b64(ct)}}
async function dl(){
 let out;try{out=await encrypt(_d)}catch(e){return alert('Chiffrement impossible : ouvrez la page via https ou un navigateur récent.')}
 const a=document.createElement('a');
 a.href=URL.createObjectURL(new Blob([JSON.stringify(out,null,2)],{type:'application/json'}));
 a.download=`${_d.classe}_${_d.test}_${_d.id}.json`.replace(/[^\w.\-]+/g,'_');a.click()}
function lost(){if(run)testScreen('⚠ Vous avez quitté la page : vos réponses ont été perdues. Vous devez recommencer le test.')}
document.addEventListener('visibilitychange',()=>{if(document.hidden)lost()});
addEventListener('blur',lost);
addEventListener('beforeunload',e=>{if(run){e.preventDefault();e.returnValue=''}});
PR?testScreen():profil();
</script></body></html>
